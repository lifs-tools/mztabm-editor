 version: '3.7'
 services:
  mztabmedit:
    #env_file:
    #  - .env
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - __pycache__
            - Dockerfile
        - action: rebuild
          path: Dockerfile
    image: mztabmedit
    container_name: mztabmedit
    restart: on-failure
    ports:
      - 8501:8501
    networks:
      - network
 networks:
   network:
     driver: bridge
